# pip 镜像：清华 TUNA（https://mirrors.tuna.tsinghua.edu.cn/help/pypi/）
#
# install.sh 会把本文件软链到 ~/.config/pip/pip.conf（pip 的用户级配置），之后在终端里跑的
# pip install 都走镜像。国内直连 pypi.org 时通时断（RemoteDisconnected / SSLEOFError）。
#
# 管不到的地方：
#   - brew 的 HOMEBREW_PIP_INDEX_URL（见 brew.env）只管 brew 自己编译的 formula
#   - Homebrew 7 跑 cask 安装脚本时会进沙箱，HOME 换成临时目录、禁止读家目录，这份配置读不到。
#     例如 gcloud-cli 装完会建 virtualenv 再 pip install，用的是 pypi.org，网络不通会装失败，
#     这种要靠代理（软路由 / TUN 模式）给 pypi.org、files.pythonhosted.org 放行
#   - 如果 ~/Library/Application Support/pip/ 目录存在，pip 会改读那里的 pip.conf，不再读 ~/.config/pip/
#
# 不需要镜像（如海外）：把 index-url 这行注释掉即可

[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
